<!-- Stack-agnostic example: pure HTML + the generated CSS variables.
     Works in any framework. Open in a browser to preview. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Sugar — token demo</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css" />
  <link rel="stylesheet" href="../tokens/variables.css" />
  <style>
    body {
      margin: 0;
      background: var(--hs-color-bg);
      color: var(--hs-color-text);
      font-family: var(--hs-font-sans);
      font-size: var(--hs-font-size-base);
      line-height: var(--hs-leading-normal);
      padding: var(--hs-space-8);
    }
    .card {
      background: var(--hs-color-surface);
      border: 1px solid var(--hs-color-border);
      border-radius: var(--hs-radius-lg);
      box-shadow: var(--hs-shadow-md);
      padding: var(--hs-space-6);
      max-width: 420px;
    }
    h1 {
      font-family: var(--hs-font-display);
      color: var(--hs-color-primary);
      font-size: var(--hs-font-size-4xl);
      line-height: var(--hs-leading-tight);
      margin: 0 0 var(--hs-space-2);
    }
    .muted { color: var(--hs-color-text-muted); font-size: var(--hs-font-size-sm); }
    .btn {
      display: inline-block;
      margin-top: var(--hs-space-5);
      padding: var(--hs-space-3) var(--hs-space-5);
      border: none;
      border-radius: var(--hs-radius-pill);
      background: var(--hs-color-primary);
      color: var(--hs-color-on-primary);
      font-family: var(--hs-font-sans);
      font-weight: var(--hs-font-weight-semibold);
      font-size: var(--hs-font-size-base);
      cursor: pointer;
    }
    .btn:hover { background: var(--hs-color-primary-strong); }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--hs-radius-pill);
      background: var(--hs-color-primary-soft);
      color: var(--hs-color-deep);
      font-size: var(--hs-font-size-xs);
      font-weight: var(--hs-font-weight-semibold);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Onboarding</span>
    <h1>Hello Sugar</h1>
    <p class="muted">New location setup — 4 of 6 systems configured.</p>
    <button class="btn">Mark complete</button>
  </div>
</body>
</html>
